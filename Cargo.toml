[workspace]
members = [
    ".",
    "plugins/plugin-core",
    "plugins/plugin_auth",
    "plugins/plugin_sql",
    "plugins/plugin_mongo",
    "plugins/plugin_upload",
    "plugins/plugin_health",
]

[package]
name = "small-folks"
authors = ["Stephane MASCARON <stephane@mascaron.net>"]
version = "0.1.0"
edition = "2024"

[dependencies]
plugin-core  = { path = "plugins/plugin-core" }
libloading   = "0.8"
tide         = "0.16"
tokio        = { version = "1", features = ["full"] }
sqlx         = { version = "0.7", features = ["mysql", "runtime-tokio-native-tls"] }
mongodb      = "^3.5"
dotenvy      = "0.15"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
handlebars = { version = "6.4.0", features = ["dir_source"] }
regex        = "1"
bytes        = "1"
