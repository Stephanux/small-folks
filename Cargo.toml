[workspace]
members = [
    ".", "mongodb_test",
    "plugin-core",
    "plugin_sql",
]

[package]
name = "rust-plugin-tide"
authors = ["Stephane MASCARON <stephane@mascaron.net>"]
version = "0.1.0"
edition = "2021"

[dependencies]
plugin-core  = { path = "plugin-core" }
libloading   = "0.8"
tide         = "0.16"
tokio        = { version = "1", features = ["full"] }
sqlx         = { version = "0.7", features = ["mysql", "runtime-tokio-native-tls"] }
dotenvy      = "0.15"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
handlebars = { version = "6.4.0", features = ["dir_source"] }
regex        = "1"
