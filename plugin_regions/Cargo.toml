[package]
name = "plugin_regions"
version = "0.1.0"
edition = "2021"

[dependencies]
plugin-core = { path = "../plugin-core" }
sqlx        = { version = "0.7", features = ["mysql", "runtime-tokio-native-tls"] }
tokio       = { version = "1", features = ["rt"] }
serde_json  = "1"
regex       = "1"

[lib]
crate-type = ["cdylib"]
