[package]
name = "plugin-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tide       = "0.16"
sqlx       = { version = "0.7", features = ["mysql", "runtime-tokio-native-tls"] }
tokio      = { version = "1", features = ["rt"] }
mongodb    = "^3.5"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1.89"
regex        = "1"

[lib]
crate-type = ["rlib"]
