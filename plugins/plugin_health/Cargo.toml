[package]
name = "plugin_health"
version = "0.1.0"
edition = "2021"

[dependencies]
plugin-core  = { path = "../plugin-core" }
serde_json   = "1"
sysinfo      = "0.30"
sqlx         = { version = "0.7", features = ["mysql", "runtime-tokio-native-tls"] }
mongodb      = "^3.5"
tokio        = { version = "1", features = ["time"] }

[lib]
crate-type = ["cdylib"]
