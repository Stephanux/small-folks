[package]
name = "plugin_mongo"
version = "0.1.0"
edition = "2021"

[dependencies]
plugin-core = { path = "../plugin-core" }
futures-util =  { version = "0.3", default-features = false, features = ["alloc"] }
mongodb     = "^3.5"
bson        = "2"
tokio       = { version = "1", features = ["rt"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
regex       = "1"
async-trait = "0.1.89"

[lib]
crate-type = ["cdylib"]
